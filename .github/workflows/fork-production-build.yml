name: Fork Production Build

on:
  push:
    branches: ["v4.x"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-coolify:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version
        id: version
        run: |
          echo "VERSION=$(docker run --rm -v "$(pwd):/app" -w /app php:8.2-alpine3.16 php bootstrap/getVersion.php)"|xargs >> $GITHUB_OUTPUT

      - name: Build and Push Image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/fazer-ai/coolify:${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}

  merge-coolify-manifest:
    runs-on: ubuntu-24.04
    needs: build-coolify
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version
        id: version
        run: |
          echo "VERSION=$(docker run --rm -v "$(pwd):/app" -w /app php:8.2-alpine3.16 php bootstrap/getVersion.php)"|xargs >> $GITHUB_OUTPUT

      - name: Create & publish multi-arch manifest
        run: |
          docker buildx imagetools create \
          ${{ env.REGISTRY }}/fazer-ai/coolify:${{ steps.version.outputs.VERSION }}-amd64 \
          ${{ env.REGISTRY }}/fazer-ai/coolify:${{ steps.version.outputs.VERSION }}-aarch64 \
          --tag ${{ env.REGISTRY }}/fazer-ai/coolify:${{ steps.version.outputs.VERSION }} \
          --tag ${{ env.REGISTRY }}/fazer-ai/coolify:latest

  upload-cdn:
    runs-on: ubuntu-24.04
    needs: merge-coolify-manifest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get Versions
        id: versions
        run: |
          echo "VERSION=$(docker run --rm -v "$(pwd):/app" -w /app php:8.2-alpine3.16 php bootstrap/getVersion.php)"|xargs >> $GITHUB_OUTPUT
          echo "HELPER_VERSION=$(docker run --rm -v "$(pwd):/app" -w /app php:8.2-alpine3.16 php bootstrap/getHelperVersion.php)"|xargs >> $GITHUB_OUTPUT
          echo "REALTIME_VERSION=$(docker run --rm -v "$(pwd):/app" -w /app php:8.2-alpine3.16 php bootstrap/getRealtimeVersion.php)"|xargs >> $GITHUB_OUTPUT

      - name: Generate versions.json
        run: |
          cat > /tmp/versions.json <<EOF
          {
            "version": "${{ steps.versions.outputs.VERSION }}",
            "helper_version": "${{ steps.versions.outputs.HELPER_VERSION }}",
            "realtime_version": "${{ steps.versions.outputs.REALTIME_VERSION }}"
          }
          EOF

      - name: Upload files to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put fazer-ai-cdn/coolify/install.sh --file=scripts/install.sh --content-type="text/plain"
          npx wrangler r2 object put fazer-ai-cdn/coolify/upgrade.sh --file=scripts/upgrade.sh --content-type="text/plain"
          npx wrangler r2 object put fazer-ai-cdn/coolify/docker-compose.yml --file=docker-compose.yml --content-type="text/yaml"
          npx wrangler r2 object put fazer-ai-cdn/coolify/docker-compose.prod.yml --file=docker-compose.prod.yml --content-type="text/yaml"
          npx wrangler r2 object put fazer-ai-cdn/coolify/.env.production --file=.env.production --content-type="text/plain"
          npx wrangler r2 object put fazer-ai-cdn/coolify/versions.json --file=/tmp/versions.json --content-type="application/json"
